<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de préstamos de la biblioteca</title>
</head>
<body>

    <h1>Control de préstamos de la biblioteca</h1>

    <!-- HU-01: Registrar libros -->

    <h2>Registrar libros</h2>

    <form>
        <label>Título del libro:</label>
        <input type="text" placeholder="Escribe el título">

        <br><br>

        <label>Autor:</label>
        <input type="text" placeholder="Escribe el autor">

        <br><br>

        <label>Categoría:</label>
        <input type="text" placeholder="Escribe la categoría">

        <br><br>

        <label>ISBN:</label>
        <input type="text" placeholder="Escribe el ISBN">

        <br><br>

        <button type="button">Registrar libro</button>
    </form>

    <hr>

    <!-- HU-02: Consultar libros disponibles -->

    <h2>Consultar libros disponibles</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Categoría</th>
                <th>Disponibilidad</th>
            </tr>
        </thead>

        <tbody id="listaLibros">
        </tbody>
    </table>

    <hr>

    <!-- HU-03: Registrar préstamos -->

    <h2>Registrar préstamos</h2>

    <form>
        <label>Nombre del estudiante:</label>
        <input type="text" placeholder="Escribe el nombre">

        <br><br>

        <label>Matrícula del estudiante:</label>
        <input type="text" placeholder="Escribe la matrícula">

        <br><br>

        <label>Nombre del libro:</label>
        <input type="text" placeholder="Escribe el nombre del libro">

        <br><br>

        <label>Fecha del préstamo:</label>
        <input type="date">

        <br><br>

        <label>Fecha límite de devolución:</label>
        <input type="date">

        <br><br>

        <button type="button">Registrar préstamo</button>
    </form>

    <hr>

    <!-- HU-04: Registrar devoluciones -->

    <h2>Registrar devoluciones</h2>

    <form>
        <label>Nombre del estudiante:</label>
        <input type="text" placeholder="Escribe el nombre">

        <br><br>

        <label>Matrícula del estudiante:</label>
        <input type="text" placeholder="Escribe la matrícula">

        <br><br>

        <label>Nombre del libro:</label>
        <input type="text" placeholder="Escribe el nombre del libro">

        <br><br>

        <label>Fecha de devolución:</label>
        <input type="date">

        <br><br>

        <button type="button">Registrar devolución</button>
    </form>


    <!-- HU-05: Registrar fecha límite de devolución -->
<section>
    <h2>Registrar fecha límite de devolución</h2>

    <form>
        <label for="libroFecha">Nombre del libro:</label>
        <input type="text" id="libroFecha" required>

        <label for="alumnoFecha">Nombre del estudiante:</label>
        <input type="text" id="alumnoFecha" required>

        <label for="fechaLimite">Fecha límite de devolución:</label>
        <input type="date" id="fechaLimite" required>

        <button type="submit">Registrar fecha límite</button>
    </form>
</section>

</body>
</html>
